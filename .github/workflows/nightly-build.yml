name: Nightly Build

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  nightly-release:
    name: Build & Release Nightly APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local Java path from gradle.properties
        run: sed -i '/^[[:space:]]*org\.gradle\.java\.home=/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Validate secrets before bumping the version so a bad secret cannot leave a
      # published version bump with no APK.
      - name: Inject Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          STATS_BASE_URL: ${{ secrets.STATS_BASE_URL }}
          AUTH_API_BASE_URL: ${{ secrets.AUTH_API_BASE_URL }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is empty"
            exit 1
          fi

          # Accept either raw JSON or base64-encoded JSON.
          TRIMMED="$(printf '%s' "${GOOGLE_SERVICES_JSON}" | sed -e 's/^[[:space:]]*//')"
          if printf '%s' "${TRIMMED}" | head -c 1 | grep -q '{'; then
            printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          else
            printf '%s' "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json
          fi

          python3 - <<'PY'
          import json, sys
          path = "app/google-services.json"
          try:
              data = json.load(open(path))
          except Exception as e:
              print(f"::error::google-services.json is not valid JSON ({e})", file=sys.stderr)
              sys.exit(1)
          if not isinstance(data, dict) or ("project_info" not in data and "client" not in data):
              print("::error::google-services.json is missing project_info/client — check GOOGLE_SERVICES_JSON secret (raw JSON or base64)", file=sys.stderr)
              sys.exit(1)
          print("google-services.json OK")
          PY

          if [ -z "${SIGNING_KEY_BASE64}" ]; then
            echo "::error::SIGNING_KEY_BASE64 secret is empty"
            exit 1
          fi
          printf '%s' "${SIGNING_KEY_BASE64}" | base64 --decode > app/keystore.jks
          test -s app/keystore.jks

          {
            echo "google.api.key=${GOOGLE_API_KEY}"
            echo "stats.api.key=${STATS_API_KEY}"
            echo "stats.base.url=${STATS_BASE_URL}"
            echo "auth.api.base.url=${AUTH_API_BASE_URL}"
          } >> local.properties

      - name: Bump Version
        run: |
          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)

          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION_NAME"
          PATCH_VERSION=${VERSION_PARTS[2]}
          NEW_PATCH_VERSION=$((PATCH_VERSION + 1))
          NEW_VERSION_NAME="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$NEW_PATCH_VERSION"

          sed -i "s/versionCode = $VERSION_CODE/versionCode = $NEW_VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"$VERSION_NAME\"/versionName = \"$NEW_VERSION_NAME\"/" app/build.gradle.kts

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: Bump version to $NEW_VERSION_NAME (Nightly)"
          git push

          echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV

      - name: Build Nightly APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ./gradlew assembleNightly \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/app/keystore.jks" \
            -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASSWORD}"

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/nightly -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/nightly -name '*.apk' | head -n 1)
          fi
          mv "$APK" "Airbeats-v${NEW_VERSION_NAME}-Nightly.apk"

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.NEW_VERSION_NAME }}-nightly"
          name: "Airbeats-Nights v${{ env.NEW_VERSION_NAME }}"
          body: "This is the latest automatic nightly build generated from the main branch."
          prerelease: true
          files: Airbeats-v${{ env.NEW_VERSION_NAME }}-Nightly.apk

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local Java path from gradle.properties
        run: sed -i '/^[[:space:]]*org\.gradle\.java\.home=/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          STATS_BASE_URL: ${{ secrets.STATS_BASE_URL }}
          AUTH_API_BASE_URL: ${{ secrets.AUTH_API_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is empty"
            exit 1
          fi

          TRIMMED="$(printf '%s' "${GOOGLE_SERVICES_JSON}" | sed -e 's/^[[:space:]]*//')"
          if printf '%s' "${TRIMMED}" | head -c 1 | grep -q '{'; then
            printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
          else
            printf '%s' "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json
          fi

          python3 - <<'PY'
          import json, sys
          path = "app/google-services.json"
          try:
              data = json.load(open(path))
          except Exception as e:
              print(f"::error::google-services.json is not valid JSON ({e})", file=sys.stderr)
              sys.exit(1)
          if not isinstance(data, dict) or ("project_info" not in data and "client" not in data):
              print("::error::google-services.json is missing project_info/client — check GOOGLE_SERVICES_JSON secret (raw JSON or base64)", file=sys.stderr)
              sys.exit(1)
          print("google-services.json OK")
          PY

          {
            echo "google.api.key=${GOOGLE_API_KEY}"
            echo "stats.api.key=${STATS_API_KEY}"
            echo "stats.base.url=${STATS_BASE_URL}"
            echo "auth.api.base.url=${AUTH_API_BASE_URL}"
          } >> local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
