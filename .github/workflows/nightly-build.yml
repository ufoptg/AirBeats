name: Nightly Build

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "README.en.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_nightly:
    name: Build Nightly APK
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local Java path from gradle.properties
        run: sed -i '/^[[:space:]]*org\.gradle\.java\.home=/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare build config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          STATS_BASE_URL: ${{ secrets.STATS_BASE_URL }}
          AUTH_API_BASE_URL: ${{ secrets.AUTH_API_BASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, sys
          from pathlib import Path

          out = Path("app/google-services.json")
          raw = os.environ.get("GOOGLE_SERVICES_JSON") or ""

          def valid(data: object) -> bool:
              return isinstance(data, dict) and ("project_info" in data or "client" in data)

          used_secret = False
          if raw.strip():
              candidates = []
              stripped = raw.lstrip()
              if stripped.startswith("{"):
                  candidates.append(raw)
              try:
                  candidates.append(base64.b64decode(raw).decode("utf-8"))
              except Exception:
                  pass
              for candidate in candidates:
                  try:
                      data = json.loads(candidate)
                  except Exception:
                      continue
                  if valid(data):
                      out.write_text(json.dumps(data, indent=2) + "\n")
                      used_secret = True
                      print("Using GOOGLE_SERVICES_JSON secret")
                      break

          if not used_secret:
              print("GOOGLE_SERVICES_JSON missing/invalid — using CI stub (MuSicX-style build)")
              data = {
                  "project_info": {
                      "project_number": "000000000000",
                      "project_id": "airbeats-ci",
                      "storage_bucket": "airbeats-ci.appspot.com",
                  },
                  "client": [
                      {
                          "client_info": {
                              "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                              "android_client_info": {"package_name": "com.darkxvenom.airbeats"},
                          },
                          "oauth_client": [],
                          "api_key": [{"current_key": "AIzaSyCiStubKeyForAirBeatsBuilds000"}],
                          "services": {"appinvite_service": {"other_platform_oauth_client": []}},
                      },
                      {
                          "client_info": {
                              "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                              "android_client_info": {"package_name": "com.darkxvenom.airbeats.debug"},
                          },
                          "oauth_client": [],
                          "api_key": [{"current_key": "AIzaSyCiStubKeyForAirBeatsBuilds000"}],
                          "services": {"appinvite_service": {"other_platform_oauth_client": []}},
                      },
                  ],
                  "configuration_version": "1",
              }
              out.write_text(json.dumps(data, indent=2) + "\n")

          props = Path("local.properties")
          props.write_text(
              "\n".join(
                  [
                      f"google.api.key={os.environ.get('GOOGLE_API_KEY', '')}",
                      f"stats.api.key={os.environ.get('STATS_API_KEY', '')}",
                      f"stats.base.url={os.environ.get('STATS_BASE_URL', '')}",
                      f"auth.api.base.url={os.environ.get('AUTH_API_BASE_URL', '')}",
                      "",
                  ]
              )
          )
          PY

      - name: Bump Version
        # Versioned nightlies for the in-app updater; skip on plain pushes.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION_CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)

          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION_NAME"
          PATCH_VERSION=${VERSION_PARTS[2]}
          NEW_PATCH_VERSION=$((PATCH_VERSION + 1))
          NEW_VERSION_NAME="${VERSION_PARTS[0]}.${VERSION_PARTS[1]}.$NEW_PATCH_VERSION"

          sed -i "s/versionCode = $VERSION_CODE/versionCode = $NEW_VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"$VERSION_NAME\"/versionName = \"$NEW_VERSION_NAME\"/" app/build.gradle.kts

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: Bump version to $NEW_VERSION_NAME (Nightly)"
          git push

          echo "NEW_VERSION_NAME=$NEW_VERSION_NAME" >> "$GITHUB_ENV"

      - name: Resolve version name
        if: github.event_name == 'push'
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "NEW_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build Nightly APK
        run: ./gradlew --console=plain assembleNightly --warning-mode summary

      - name: Check signing secrets
        id: signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "${SIGNING_KEY_BASE64}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "SIGNING_KEY_BASE64 not set — uploading unsigned nightly APK"
          fi

      - name: Sign Nightly APK
        if: steps.signing.outputs.available == 'true'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/nightly/
          signingKey: ${{ secrets.SIGNING_KEY_BASE64 }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Package Nightly APK
        run: |
          set -euo pipefail
          OUT="Airbeats-v${NEW_VERSION_NAME}-Nightly.apk"
          SIGNED=$(find app/build/outputs/apk/nightly \( -name '*-signed.apk' -o -name '*-unsigned-signed.apk' \) | head -n 1 || true)
          if [ -n "${SIGNED}" ]; then
            mv "$SIGNED" "$OUT"
          else
            APK=$(find app/build/outputs/apk/nightly -name '*.apk' | head -n 1)
            mv "$APK" "$OUT"
          fi
          ls -la "$OUT"

      - name: Upload Nightly APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Nightly
          path: Airbeats-v${{ env.NEW_VERSION_NAME }}-Nightly.apk

      - name: Publish Nightly Release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.NEW_VERSION_NAME }}-nightly"
          name: "Airbeats-Nights v${{ env.NEW_VERSION_NAME }}"
          body: "This is the latest automatic nightly build generated from the main branch."
          prerelease: true
          files: Airbeats-v${{ env.NEW_VERSION_NAME }}-Nightly.apk

  build_debug:
    name: Build Debug APK
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local Java path from gradle.properties
        run: sed -i '/^[[:space:]]*org\.gradle\.java\.home=/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare build config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          STATS_BASE_URL: ${{ secrets.STATS_BASE_URL }}
          AUTH_API_BASE_URL: ${{ secrets.AUTH_API_BASE_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path

          out = Path("app/google-services.json")
          raw = os.environ.get("GOOGLE_SERVICES_JSON") or ""

          def valid(data: object) -> bool:
              return isinstance(data, dict) and ("project_info" in data or "client" in data)

          used_secret = False
          if raw.strip():
              candidates = []
              stripped = raw.lstrip()
              if stripped.startswith("{"):
                  candidates.append(raw)
              try:
                  candidates.append(base64.b64decode(raw).decode("utf-8"))
              except Exception:
                  pass
              for candidate in candidates:
                  try:
                      data = json.loads(candidate)
                  except Exception:
                      continue
                  if valid(data):
                      out.write_text(json.dumps(data, indent=2) + "\n")
                      used_secret = True
                      print("Using GOOGLE_SERVICES_JSON secret")
                      break

          if not used_secret:
              print("GOOGLE_SERVICES_JSON missing/invalid — using CI stub (MuSicX-style build)")
              data = {
                  "project_info": {
                      "project_number": "000000000000",
                      "project_id": "airbeats-ci",
                      "storage_bucket": "airbeats-ci.appspot.com",
                  },
                  "client": [
                      {
                          "client_info": {
                              "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                              "android_client_info": {"package_name": "com.darkxvenom.airbeats"},
                          },
                          "oauth_client": [],
                          "api_key": [{"current_key": "AIzaSyCiStubKeyForAirBeatsBuilds000"}],
                          "services": {"appinvite_service": {"other_platform_oauth_client": []}},
                      },
                      {
                          "client_info": {
                              "mobilesdk_app_id": "1:000000000000:android:0000000000000000000001",
                              "android_client_info": {"package_name": "com.darkxvenom.airbeats.debug"},
                          },
                          "oauth_client": [],
                          "api_key": [{"current_key": "AIzaSyCiStubKeyForAirBeatsBuilds000"}],
                          "services": {"appinvite_service": {"other_platform_oauth_client": []}},
                      },
                  ],
                  "configuration_version": "1",
              }
              out.write_text(json.dumps(data, indent=2) + "\n")

          Path("local.properties").write_text(
              "\n".join(
                  [
                      f"google.api.key={os.environ.get('GOOGLE_API_KEY', '')}",
                      f"stats.api.key={os.environ.get('STATS_API_KEY', '')}",
                      f"stats.base.url={os.environ.get('STATS_BASE_URL', '')}",
                      f"auth.api.base.url={os.environ.get('AUTH_API_BASE_URL', '')}",
                      "",
                  ]
              )
          )
          PY

      - name: Build Debug APK
        run: ./gradlew --console=plain assembleDebug --warning-mode summary

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
